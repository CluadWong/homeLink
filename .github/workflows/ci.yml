# CI 门禁（roadmap-next.md P1-1）：四项门禁与本地一致，任一失败则 job 失败。
# 测试全部基于 mock 网关，不依赖本机 Ollama / 真实红外板子。
name: ci

on: [push, pull_request]

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[mcp,agent,dev]"
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m mypy
      - run: python -m pytest -q

  e2e:
    # D1：前端场景页 E2E（真实后端 mock 网关 + 已构建 dist + Chromium）。
    # 默认 pytest 不跑（-m "not e2e"），这里显式执行。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e ".[mcp,agent,dev,e2e]"
      - run: python -m playwright install chromium
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pytest -m e2e -q

  docker:
    # E1：Linux 上真实构建镜像并拉起 backend + agent（mock 网关，不需要 Ollama）。
    # 先跑健康检查，再验证后端代理的 /api/agent/schedules 能连通 agent。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Smoke test both services
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:8000/api/agent/schedules >/dev/null; then
              echo "backend and agent are up"
              exit 0
            fi
            sleep 3
          done
          echo "services did not become ready"
          docker compose logs
          exit 1
      - name: Logs
        if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
