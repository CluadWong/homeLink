# HomeLink 重建版工具链配置：ruff + black + mypy + pytest。

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelink"
version = "0.1.0"
description = "红外单向设备管家后端（重建版）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30,<0.41",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# 可选组件：MCP 服务壳（src/homelink_mcp），服务端本体不依赖它。
mcp = [
  "mcp>=1.2,<2",
]
# 可选组件：本地管家 Agent（src/homelink_agent），依赖同款 MCP SDK 与本地 Ollama。
agent = [
  "mcp>=1.2,<2",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.11",
]

[project.scripts]
homelink-mcp = "homelink_mcp.server:main"
homelink-agent = "homelink_agent.cli:main"
homelink-agentd = "homelink_agent.daemon:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["homelink*"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  N: pep8-naming
# UP: pyupgrade  B: flake8-bugbear  SIM: flake8-simplify
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # 行宽交给 black 处理

[tool.ruff.lint.isort]
known-first-party = ["homelink", "homelink_mcp", "homelink_agent"]

# ---------- black ----------
[tool.black]
line-length = 100
target-version = ["py311"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.11"
files = ["src/homelink", "src/homelink_mcp", "src/homelink_agent", "tests"]
explicit_package_bases = true
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

# 测试函数以 pytest 注入 fixture，逐个补注解噪声大于收益；生产代码仍强制注解。
[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
disallow_untyped_defs = false

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
markers = [
  "hardware: 需要真实硬件的用例（默认不跑）",
]
